name: validate
on: [push, pull_request]
jobs:
  framework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Agent Plugins conformance
        run: python3 scripts/validate-plugin.py .
      - name: Self-tests (no model calls)
        run: |
          python3 tests/test_framework.py
          python3 tests/test_score_and_guard.py
